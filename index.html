<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last War - Resistance Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-particles"></div>
    
    <div class="container">
        <header>
            <div class="header-content">
                <h1>LAST WAR: SURVIVAL</h1>
                <h2>Resistance Calculator</h2>
            </div>
        </header>

        <main class="calculator-section">
            <div class="calculator-card">
                <h3>Damage Calculation</h3>
                <p class="calculator-subtitle">Calculate your battle resistance and damage output</p>

                <form id="calculatorForm" class="form-grid">
                    <div class="form-group">
                        <label for="squadPower">Squad Power</label>
                        <input 
                            type="text" 
                            id="squadPower" 
                            class="number-input"
                            name="squadPower"
                            placeholder="Enter Squad Power"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="targetDamage">Target Damage</label>
                        <input 
                            type="text" 
                            id="targetDamage" 
                            class="number-input"
                            name="targetDamage"
                            placeholder="Enter Target Damage"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="actualVirus">Actual Virus Resistance</label>
                        <input 
                            type="text" 
                            id="actualVirus" 
                            class="number-input"
                            name="actualVirus"
                            placeholder="Enter Actual Virus Resistance"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="actualRequired">Actual Required</label>
                        <input 
                            type="text" 
                            id="actualRequired" 
                            class="number-input"
                            name="actualRequired"
                            placeholder="Enter Actual Required"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-calculate">CALCULATE</button>
                </form>

                <div id="results" class="results-section hidden">
                    <div class="results-container">
                        <div class="result-item damage-result">
                            <h4>Damage Deal</h4>
                            <p class="result-value" id="damageDealtValue">0</p>
                        </div>

                        <div class="result-item attack-result">
                            <h4>Attack?</h4>
                            <p class="result-value" id="attackFlagValue">---</p>
                        </div>
                    </div>
                    <button type="button" class="btn-reset" onclick="resetCalculator()">RESET</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Created by <strong>CAIOVLF#1616</strong></p>
            <p>Last War: Survival Resistance Calculator</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
